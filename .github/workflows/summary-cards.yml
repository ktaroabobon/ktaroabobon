name: Update summary cards

on:
  schedule:
    # The cards in ktaroabobon/github-profile-summary-cards-example are
    # regenerated during 00:00-01:00 UTC, so recolor them after that.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build orange cards
        run: python3 -B scripts/build_cards.py
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/cards; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git commit -m "Update summary cards"
          git push
