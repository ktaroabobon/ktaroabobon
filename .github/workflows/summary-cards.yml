name: Update summary cards

on:
  schedule:
    # The cards in ktaroabobon/github-profile-summary-cards-example are
    # regenerated at 03:17 JST (18:17 UTC). Scheduled runs can start late,
    # so recolor them three hours later, at 06:17 JST (21:17 UTC).
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build orange cards
        run: python3 -B scripts/build_cards.py
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/cards; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git commit -m "Update summary cards"
          git push
